<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="juno">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>juno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
/* Layout: one-column phone app, max 480px; big highlighted headline per tab, hairline rows, floating black dock with yellow Scan */
:root{
  --bg:#FFFDF7; --surface:#F4F2EA; --card:#FFFFFF; --fg:#0A0A0A; --muted:#5E5C55; --line:#E6E3D8;
  --accent:#FFD400; --on-accent:#0A0A0A; --acc-text:#7A6100;
  --warn:#B45309; --warn-bg:#FFF4D6; --ok:#2F6B2F;
  --bar:#0A0A0A; --on-bar:#FFFFFF; --cam:#0E0F11; --on-cam:#FFFFFF; --cam-muted:#9A9BA1;
  --font:'Inter', 'Helvetica Neue', Arial, sans-serif;
  --display:'Poppins', 'Helvetica Neue', Arial, sans-serif;
  --logo:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'Inter', 'Helvetica Neue', Arial, sans-serif;
  --r:6px; --rs:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121210; --surface:#1C1B18; --card:#191815; --fg:#F5F3EA; --muted:#A6A398; --line:#2F2D28;
  --accent:#FFD400; --on-accent:#0A0A0A; --acc-text:#FFD400; --warn:#F2A65A; --warn-bg:#33240F; --ok:#8BC48B;
  --bar:#000000; --on-bar:#F5F3EA; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121210; --surface:#1C1B18; --card:#191815; --fg:#F5F3EA; --muted:#A6A398; --line:#2F2D28;
  --accent:#FFD400; --on-accent:#0A0A0A; --acc-text:#FFD400; --warn:#F2A65A; --warn-bg:#33240F; --ok:#8BC48B;
  --bar:#000000; --on-bar:#F5F3EA; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 128px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wordmark{font-family:var(--logo);font-weight:800;font-size:24px;letter-spacing:-.04em}
.wordmark{display:inline-flex;align-items:flex-end;line-height:.95}.wordmark svg{width:.56em;height:.56em;margin:0 0 .08em .03em;flex:none}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(27px,8vw,32px);line-height:1.12;letter-spacing:-.02em;text-wrap:balance;margin:0}
.mark{background:var(--accent);color:var(--on-accent);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.iconbtn{width:44px;height:44px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex-shrink:0}
.iconbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--fg)}
.iconbtn svg{width:20px;height:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--fg);border-radius:var(--rs);overflow:hidden}
.seg button{height:42px;border:0;border-right:1px solid var(--fg);background:var(--card);font-weight:600;font-size:14px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 10px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--fg)}
.chip.ink{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{height:54px;border-radius:var(--r);border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;width:100%;text-align:left}
.btn .mono{font-size:12px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.btn.small{height:40px;font-size:14px;width:auto;padding:0 14px}
.btn:disabled{opacity:.5;cursor:default}
.textbtn{border:0;background:none;padding:0 4px;min-height:44px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:24px}
.rows > .row:last-child{border-bottom:1px solid var(--line)}
.row .name{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row .qty{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:3px 7px;border-radius:3px;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.acc{background:var(--accent);color:var(--on-accent)}
.badge.line{border:1px solid var(--line);color:var(--muted)}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--fg);font-size:14px;line-height:1.45}
.notice b{color:var(--warn)}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.cover{background:var(--accent);color:var(--on-accent);padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;position:relative}
.cover .words{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.7;opacity:.85}
.cover.alt{background:var(--surface);color:var(--fg)}
.matchbar{display:grid;gap:3px}
.matchbar span{height:4px;background:var(--line)}
.matchbar span.on{background:var(--fg)}
.empty{border:1px dashed var(--fg);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--muted);line-height:1.5}
.skel{height:64px;border-radius:var(--r);background:var(--surface);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.err{color:var(--warn);font-size:14px;line-height:1.45}
.bar{height:6px;width:64px;background:var(--line);display:flex;flex-shrink:0}
.bar span{background:var(--fg)}
.bar.warn span{background:var(--warn)}

/* dock */
.dockwrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock{pointer-events:auto;width:100%;max-width:448px;height:64px;border-radius:var(--r);background:var(--bar);color:var(--on-bar);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;box-sizing:border-box;border:1px solid var(--line)}
.dock .tab{width:48px;height:48px;border:0;background:none;color:inherit;opacity:.55;display:flex;align-items:center;justify-content:center;border-bottom:2px solid transparent;position:relative}
.dock .tab.on{opacity:1;border-bottom-color:var(--accent)}
.dock .tab svg{width:22px;height:22px}
.dock .tab .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:4px;background:var(--accent)}
.dock .scan{height:48px;padding:0 16px;border-radius:var(--rs);border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dock .scan svg{width:20px;height:20px}

/* overlays */
#ov{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);color:var(--fg);-webkit-overflow-scrolling:touch}
#ov.cam{background:var(--cam);color:var(--on-cam)}
#ov.cook{background:var(--cam);color:var(--on-cam)}
.ovin{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.stickyfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:45}
.stickyfoot > *{max-width:448px}
#ov.cam .stickyfoot,#ov.cook .stickyfoot{background:linear-gradient(to top,var(--cam) 70%,transparent)}
.camtabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.camtabs button{border:0;background:none;color:var(--cam-muted);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 0 8px;border-bottom:2px solid transparent;white-space:nowrap}
.camtabs button.on{color:var(--on-cam);border-bottom-color:var(--accent)}
.viewfinder{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r);overflow:hidden;background:#1A1C20;display:flex;align-items:center;justify-content:center;text-align:center}
.viewfinder img{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .hint{padding:24px;color:var(--cam-muted);font-size:15px;line-height:1.5;max-width:28ch}
.corner{position:absolute;width:26px;height:26px;border-color:var(--accent);border-style:solid;border-width:0}
.c1{left:14px;top:14px;border-left-width:3px;border-top-width:3px}.c2{right:14px;top:14px;border-right-width:3px;border-top-width:3px}
.c3{left:14px;bottom:14px;border-left-width:3px;border-bottom-width:3px}.c4{right:14px;bottom:14px;border-right-width:3px;border-bottom-width:3px}
.scanline{position:absolute;left:14px;right:14px;height:2px;background:var(--accent);top:20%;animation:scan 1.6s ease-in-out infinite alternate;box-shadow:0 0 12px var(--accent)}
@keyframes scan{to{top:80%}}
.busytag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:6px 10px;border-radius:var(--rs);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.shutterrow{display:flex;justify-content:space-between;align-items:center}
.shutter{width:80px;height:80px;padding:0;background:transparent;border-radius:40px;border:3px solid var(--on-cam);display:flex;align-items:center;justify-content:center;cursor:pointer}
.shutter span{width:62px;height:62px;border-radius:31px;background:var(--accent)}
.camsmall{width:48px;height:48px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--on-cam);display:flex;align-items:center;justify-content:center;cursor:pointer}
.camsmall svg{width:20px;height:20px}
textarea{width:100%;box-sizing:border-box;border-radius:var(--rs);border:1px solid var(--fg);background:var(--card);padding:12px 14px;font-size:16px;line-height:1.45;resize:vertical;min-height:96px}
input[type=text],input[type=date],input[type=number],select{height:46px;box-sizing:border-box;border-radius:var(--rs);border:1px solid var(--fg);background:var(--card);padding:0 12px;font-size:16px}
.shot{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:var(--r);overflow:hidden;background:#1A1C20}
.shot img{display:block;max-width:100%;max-height:56vh}
.shot .tag{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:#0A0A0A;font-weight:700;font-size:13px;line-height:1;padding:7px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.shot .tag.unsure{background:#FFFFFF}
.shot .tag.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
/* ---------- TikTok-indeling: Scan | Recepten, schermvullend ---------- */
:root{--barh:58px}
.ttapp{padding:0;margin:0}
.pager{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:520px;bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px));display:flex;overflow-x:hidden;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;background:#0A0A0A}
.pager::-webkit-scrollbar,.feed::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff}
#ttTop{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:520px;z-index:20;pointer-events:none}
.tttop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
.tttop > *{pointer-events:auto}
.tttabs{display:flex;gap:18px}
.tttabs button{background:none;border:0;color:rgba(255,255,255,.62);font-weight:700;font-size:17px;padding:6px 0;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.tttabs button.on{color:#fff}
.tttabs button.on::after{content:"";position:absolute;left:50%;bottom:0;width:22px;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%)}
.ttic{width:40px;height:40px;border:0;border-radius:20px;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.ttic svg{width:22px;height:22px}
/* scan */
.ttcam{position:absolute;inset:0;background:#111}
.ttcam .camvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ttcam .tag,.ttshot .tag{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:#0A0A0A;font-weight:700;font-size:14px;line-height:1;padding:8px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.4);max-width:52vw;overflow:hidden;text-overflow:ellipsis;transition:left .5s ease,top .5s ease}
.ttcam .tag.unsure,.ttshot .tag.unsure{background:#fff}
.ttcam .tag.pop,.ttshot .tag.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ttcam .livepill{top:calc(env(safe-area-inset-top,0px) + 62px)}
.ttshot{position:absolute;inset:0;background:#111}
.ttshot img{width:100%;height:100%;object-fit:cover;display:block}
.ttoff{display:flex;align-items:center;justify-content:center;padding:24px}
.ttoffmsg{max-width:30ch;text-align:center;display:flex;flex-direction:column;gap:8px;color:#C9C9CE;line-height:1.45;font-size:15px}
.ttoffmsg b{color:#fff;font-size:18px}
.ttscanfoot{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.72) 55%,transparent)}
.ttfound{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ttfound button{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:14px;font-weight:600}
.ttfound button span{opacity:.6}
.ttshutter{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:10px}
.ttshutter .mid{display:flex;justify-content:center}
.ttsmall{width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.ttsmall svg{width:22px;height:22px}
.ttcount{display:flex;flex-direction:column;align-items:center;line-height:1}
.ttcount b{font-size:40px;font-weight:800;letter-spacing:-.04em}
.ttcount span{font-size:14px;color:#C9C9CE;margin-top:4px}
.ttgo{height:52px;border:0;border-radius:12px;background:var(--accent);color:#0A0A0A;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.ttgo .mono{font-size:15px}
.ttnote{background:rgba(255,212,0,.16);border:1px solid rgba(255,212,0,.45);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4}
/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;touch-action:manipulation;cursor:pointer}
.slide.s-y{background:#FFD400;color:#0A0A0A}
.slide.s-k{background:#0A0A0A;color:#fff}
.slide.s-w{background:#F4F2EA;color:#0A0A0A}
.giant{position:absolute;left:-4px;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;font-weight:800;font-size:clamp(46px,15vw,78px);line-height:.92;letter-spacing:-.05em;text-transform:lowercase;pointer-events:none;padding-left:14px}
.giant span{white-space:nowrap;overflow:hidden;text-overflow:clip}
.s-y .giant{color:rgba(10,10,10,.13)} .s-w .giant{color:rgba(10,10,10,.1)} .s-k .giant{color:rgba(255,212,0,.2)}
.cap{position:absolute;left:14px;right:84px;bottom:30px;display:flex;flex-direction:column;gap:8px}
.cap h2{margin:0;font-weight:800;font-size:clamp(28px,8.6vw,38px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.cap p{margin:0;font-size:15px;line-height:1.4;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.capmeta{font-size:11px;opacity:.8}
.capbadges{display:flex;gap:6px;flex-wrap:wrap}
.s-k .capbadges .badge.acc{background:var(--accent);color:#0A0A0A}
.s-y .capbadges .badge.acc{background:#0A0A0A;color:var(--accent)}
.s-w .capbadges .badge.acc{background:#0A0A0A;color:var(--accent)}
.caphint{font-size:10px;opacity:.55}
.rail{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:inherit;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0;width:62px}
.rail button i{width:50px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-style:normal}
.s-y .rail button i{background:rgba(10,10,10,.1)} .s-w .rail button i{background:rgba(10,10,10,.07)} .s-k .rail button i{background:rgba(255,255,255,.12)}
.rail button i svg{width:24px;height:24px}
.rail button.on i{background:#0A0A0A;color:var(--accent)}
.s-k .rail button.on i{background:var(--accent);color:#0A0A0A}
.burst{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;color:#FF3D5A;animation:burst .8s ease forwards}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.3) translateY(-30px);opacity:0}}
.slidemsg{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:90px 20px 40px}
.slidemsg h2{margin:0;font-weight:800;font-size:clamp(32px,10vw,44px);line-height:1;letter-spacing:-.04em;text-wrap:balance}
.slidemsg p{margin:0;font-size:16px;line-height:1.5;opacity:.8}
.slidemsg .seg{background:transparent}
.dots3{display:flex;gap:8px}.dots3 i{width:12px;height:12px;border-radius:6px;background:currentColor;animation:pulse 1s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
.swipehint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;pointer-events:none}
/* swipe-kaarten */
.tfeed{position:absolute;inset:0;background:#0A0A0A;display:flex;flex-direction:column}
.moods{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 66px) 14px 0;flex:none}
.moods::-webkit-scrollbar{display:none}
.moods button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid #3A3B3F;background:none;color:#fff;font-weight:600;font-size:15px}
.moods button.on{background:#fff;color:#0A0A0A;border-color:#fff;font-weight:700}
.stack{position:relative;flex:1;min-height:0;margin:12px 14px 0}
.tcard{position:absolute;inset:0;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .25s ease}
.tcard.drag{transition:none;cursor:grabbing}
.tcard.under{transform:scale(.95) translateY(10px);filter:brightness(.6);pointer-events:none}
.tcard.s-y{background:#FFD400;color:#0A0A0A}.tcard.s-k{background:#1A1B1E;color:#fff}.tcard.s-w{background:#F4F2EA;color:#0A0A0A}
.tcard .giant{top:16px}
.tcard .cap{right:16px;bottom:16px;left:16px}
.tcard .cap h2{font-size:clamp(28px,8.6vw,36px)}
.stamp{position:absolute;top:26px;padding:4px 12px;border:4px solid;border-radius:8px;font-weight:800;font-size:28px;letter-spacing:.04em;opacity:0;pointer-events:none}
.stamp.yes{left:20px;color:#2F6B2F;transform:rotate(-16deg)}
.stamp.no{right:20px;color:#B45309;transform:rotate(16deg)}
.s-k .stamp.yes{color:#7BD17B}.s-k .stamp.no{color:#F2A65A}
.labels{display:flex;gap:6px;flex-wrap:wrap}
.moods .mysmaak{display:inline-flex;align-items:center;gap:6px;border-color:#FFD400;color:#FFD400;font-weight:700}
.moods .mysmaak svg,.ttpill svg{width:18px;height:18px}
.ttpill{height:40px;padding:0 14px;border-radius:20px;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.profcard{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:0;background:#0A0A0A;color:#fff;text-align:left}
.profcard .pi{width:44px;height:44px;border-radius:22px;background:#FFD400;color:#0A0A0A;display:flex;align-items:center;justify-content:center;flex:none}
.profcard .pi svg{width:22px;height:22px}
.profcard b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
.profcard span span,.profcard > span:nth-child(2) span{display:block;font-size:14px;color:#C9C9CE;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profcard .go{flex:none;font-weight:700;font-size:15px;color:#FFD400}
.clearbar{display:flex;justify-content:flex-end}
.clearbar .textlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:none;color:var(--warn);font-weight:600;font-size:15px;padding:0}
.clearbar .textlink svg{width:18px;height:18px}
.clearbar.armed{flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border-radius:10px;background:var(--warn-bg);justify-content:space-between}
.clearbar.armed span{flex:1 1 180px;font-size:15px;line-height:1.4}
.btn.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.flist{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 96px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none;overscroll-behavior:contain}
.flist::-webkit-scrollbar{display:none}
.fcard{background:#17181B;border-radius:18px;overflow:hidden;color:#fff;cursor:pointer;position:relative;flex:none}
.fphoto{position:relative;aspect-ratio:4/3;background:#2A2B2F;overflow:hidden}
.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fphoto.s-y{background:#FFD400;color:#0A0A0A}.fphoto.s-k{background:#222326;color:#FFD400}.fphoto.s-w{background:#F4F2EA;color:#0A0A0A}
.fgiant{position:absolute;inset:16px;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;opacity:.2;display:flex;flex-direction:column;overflow:hidden;text-transform:lowercase}
.fheart{position:absolute;right:12px;top:12px;width:48px;height:48px;border-radius:24px;border:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.fheart.on{background:#FFD400;color:#0A0A0A}
.fheart svg{width:24px;height:24px}
.fbest{position:absolute;left:12px;top:12px;background:#FFD400;color:#0A0A0A;font-weight:700;font-size:14px;padding:7px 12px;border-radius:16px}
.fcredit{position:absolute;right:10px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:10px;text-decoration:none;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.finfo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.finfo h2{margin:0;font-size:22px;line-height:1.2;font-weight:600;color:#fff}
.finfo .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:600;color:#D6D6DA}
.finfo .peppers{color:#FF8A4C}
.finfo p{margin:0;font-size:15px;line-height:1.45;color:#B9B9BF;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fskel{height:320px;border-radius:18px;background:#1E1F22;animation:pulse 1.2s infinite;flex:none}
.fstatus{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#E6E6EA;font-size:15px}
.fend{min-height:40px;text-align:center;color:#C9C9CE;display:flex;flex-direction:column;align-items:center;gap:8px}
.surprise{position:absolute;right:16px;bottom:16px;z-index:5;height:50px;padding:0 20px;border-radius:25px;border:0;background:#FFD400;color:#0A0A0A;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.surprise svg{width:20px;height:20px}
.swipewrap{position:fixed;inset:0;max-width:520px;margin:0 auto;background:#0A0A0A;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40}
.swipetop{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff}
.swipetop b{font-size:19px}
.swipehelp{margin:0;text-align:center;color:#9A9BA1;font-size:14px}
.dphoto{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.dphoto img{width:100%;height:100%;object-fit:cover;display:block}
.mealseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));flex:1;min-width:0;margin-right:10px;background:rgba(30,31,34,.92);border-radius:22px;padding:3px}
.mealseg button{height:38px;border:0;border-radius:19px;background:none;color:rgba(255,255,255,.7);font-weight:700;font-size:15px}
.mealseg button.on{background:#FFD400;color:#0A0A0A}
.tcard .tphoto{position:absolute;left:0;right:0;top:0;height:56%;background:#2A2B2F}
.tcard .tphoto img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.tcard.hasimg .cap h2{font-size:clamp(26px,7.6vw,32px)}
.tcard .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:600;opacity:.85}
.tcard .cap p{font-size:16px;-webkit-line-clamp:2}
.tcard .credit{position:absolute;right:8px;top:calc(56% - 30px);font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:10px;text-decoration:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{height:30px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;font-weight:700;font-size:14px;border:1px solid currentColor}
.lab.ok{background:#2F6B2F;color:#fff;border-color:#2F6B2F}
.lab.warn{background:#B45309;color:#fff;border-color:#B45309}
.lab.acc{background:#0A0A0A;color:#FFD400;border-color:#0A0A0A}
.s-k .lab.acc{background:#FFD400;color:#0A0A0A;border-color:#FFD400}
.peppers{display:inline-flex;color:#C2410C}.s-k .peppers{color:#FF8A4C}
.tbtns{flex:none;display:flex;justify-content:center;align-items:center;gap:22px;padding:14px 0 6px}
.tbtns button{border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #3A3B3F;background:#141518;color:#fff}
.tbtns .big{width:64px;height:64px}.tbtns .mid{width:48px;height:48px}
.tbtns .yes{background:#FFD400;border-color:#FFD400;color:#0A0A0A}
.tbtns svg{width:26px;height:26px}
.thint{flex:none;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#8A8B90;padding-bottom:10px}
.mealpill{height:36px;padding:0 12px;border-radius:18px;border:0;background:rgba(30,31,34,.9);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
/* scan-modi */
.modes{display:flex;justify-content:center;gap:4px;font-weight:700;font-size:14px}
.modes button{padding:9px 12px;border-radius:999px;border:0;background:none;color:#C9C9CE}
.modes button.on{background:#fff;color:#0A0A0A}
.ttcam .tag.add{background:#fff;padding:6px 6px 6px 12px;display:inline-flex;align-items:center;gap:6px;border:0;pointer-events:auto}
.ttcam .tag.add i{width:24px;height:24px;border-radius:12px;background:#0A0A0A;color:#FFD400;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.thtbox{position:absolute;left:50%;top:42%;width:62%;height:76px;transform:translate(-50%,-50%);border:3px solid #FFD400;border-radius:12px;pointer-events:none}
.thtread{position:absolute;left:50%;top:calc(42% - 64px);transform:translateX(-50%);background:#FFD400;color:#0A0A0A;font-weight:800;font-size:15px;padding:8px 12px;border-radius:999px;white-space:nowrap}
.pend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pend button{flex:none;height:36px;padding:0 6px 0 12px;border-radius:999px;border:0;background:#fff;color:#0A0A0A;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pend button i{width:24px;height:24px;border-radius:12px;background:#0A0A0A;color:#FFD400;display:flex;align-items:center;justify-content:center;font-style:normal}
/* smaakprofiel */
.ob{display:flex;flex-direction:column;gap:16px;min-height:100%}
.obbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.obbar span{height:3px;background:var(--line)}.obbar span.on{background:var(--fg)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--fg);background:none;color:var(--fg);font-weight:600;font-size:15px}
.pills button.on{background:var(--fg);color:var(--accent);font-weight:700}
.spice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--fg);border-radius:var(--r);overflow:hidden}
.spice button{height:74px;border:0;border-right:1px solid var(--fg);background:none;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.spice button:last-child{border-right:0}.spice button.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.cuis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cuis button{min-height:64px;border-radius:var(--r);border:1px solid var(--fg);background:none;color:var(--fg);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.cuis button b{font-size:16px}.cuis button span{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.cuis button.on{background:var(--fg);color:var(--bg)}.cuis button.on span{color:var(--accent);opacity:1}
.revphoto{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center}
.revphoto button{width:112px;height:112px;border-radius:14px;border:2px dashed #555;background:transparent;color:#C9C9CE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;overflow:hidden;padding:0}
.revphoto img{width:100%;height:100%;object-fit:cover}
/* onderbalk */
.ttbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:30;background:#000;color:#fff;height:calc(var(--barh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.ttbar button{background:none;border:0;color:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;position:relative;height:100%;justify-content:center}
.ttbar button.on{color:#fff}
.ttbar button svg{width:24px;height:24px}
.ttbar .dot{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:4px;background:var(--accent)}
.ttbar .plus{width:48px;height:32px;border-radius:9px;background:#fff;color:#0A0A0A;display:flex;align-items:center;justify-content:center;box-shadow:-4px 0 0 var(--accent),4px 0 0 #fff;font-size:24px;font-weight:700;line-height:1}
.ttbar .plus.on{background:var(--accent);box-shadow:-4px 0 0 #fff,4px 0 0 var(--accent)}
body.tt .app{padding-bottom:calc(var(--barh) + 40px)}
.review{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thumbs button{height:48px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px}
.thumbs button svg{width:22px;height:22px}
.thumbs button.on.up{background:#2F6B2F;border-color:#2F6B2F;color:#fff}
.thumbs button.on.down{background:#B45309;border-color:#B45309;color:#fff}
.thumbs.big2 button{height:120px;flex-direction:column;font-size:17px;background:#1A1C20;border-color:#333;color:#fff;border-radius:14px}
.thumbs.big2 button svg{width:40px;height:40px}
h1,h2,h3,.dish{font-family:var(--display);letter-spacing:-.015em}
.cap h2,.slidemsg h2{font-weight:700;letter-spacing:-.02em;line-height:1.08}
.ttcount b,.tcard .giant{font-family:var(--display)}
.codegate{position:fixed;inset:0;z-index:99;background:rgba(10,10,10,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.codecard{width:100%;max-width:440px;background:var(--bg);color:var(--fg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.codecard input{height:52px;border:1px solid var(--fg);border-radius:var(--rs);padding:0 14px;font-size:18px;font-family:var(--mono);background:var(--card);color:var(--fg)}
.livecam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;border-radius:var(--r);overflow:hidden;background:#1A1C20}
.livecam .camvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.livecam .tag{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:#0A0A0A;font-weight:700;font-size:13px;line-height:1;padding:7px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:46vw;overflow:hidden;text-overflow:ellipsis;transition:left .5s ease,top .5s ease}
.livecam .tag.unsure{background:#FFFFFF}
.livecam .tag.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.livepill{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(10,10,10,.6);color:#fff;padding:6px 10px;border-radius:var(--rs);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.livepill i{width:8px;height:8px;border-radius:4px;background:#FF4B3E;animation:pulse 1.2s infinite}
.livecam .resume{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.45);border:0;width:100%}
.livecam .resume span{background:var(--accent);color:#0A0A0A;font-weight:700;padding:12px 16px;border-radius:var(--rs)}
.livecam .camhint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.7);padding:0 16px}
.found{display:flex;flex-wrap:wrap;gap:6px}
.found button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--on-cam);font-size:14px;font-weight:600}
.found button span{opacity:.55;font-size:16px;line-height:1}
.livebar{display:flex;gap:8px}
.livebar .btn{flex:1}
.sheet{background:var(--bg);color:var(--fg);border-radius:14px 14px 0 0;margin-inline:-16px;padding:12px 16px 0;display:flex;flex-direction:column;gap:14px}
.sheet .grip{align-self:center;width:36px;height:4px;border-radius:2px;background:var(--line)}
.exp{border:2px solid var(--fg);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;margin:2px 0 6px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--fg);border-radius:var(--rs);overflow:hidden}
.seg3 > *{height:44px;border:0;border-right:1px solid var(--fg);background:var(--card);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg)}
.seg3 > *:last-child{border-right:0}
.seg3 > .on{background:var(--accent);color:var(--on-accent);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.quick .chip{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--fg);border-radius:var(--r);overflow:hidden}
.stats > div{padding:12px;border-right:1px solid var(--fg);min-width:0}
.stats > div:last-child{border-right:0}
.stats .v{font-weight:800;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.stats .hi{background:var(--accent);color:var(--on-accent)}
.stats .hi .eyebrow{color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:4px}
.stepper button{width:28px;height:28px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1}
.remix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.remix button{text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.remix .mono{font-size:10px;color:var(--acc-text);display:block;overflow-wrap:anywhere}
.remix b{display:block;margin-top:6px;font-size:15px;overflow-wrap:anywhere}
.step{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.5}
.step .mono{font-size:13px;padding-top:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--fg);border-radius:var(--rs);overflow:hidden}
.week button{border:0;border-right:1px solid var(--fg);background:var(--card);padding:10px 0;font-family:var(--mono);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px}
.week button:last-child{border-right:0}
.week button.today{background:var(--accent);color:var(--on-accent)}
.week i{width:8px;height:8px;box-sizing:border-box;border:1px solid var(--muted)}
.week i.full{background:currentColor;border-color:currentColor}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:4px;font-size:18px;color:var(--muted);line-height:1;min-width:30px;min-height:30px}
.stars button.on{color:var(--fg)}
.bubble{max-width:85%;padding:12px 14px;border-radius:var(--r);font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.bubble.juno{align-self:flex-start;background:var(--surface)}
.swipecard{touch-action:pan-y;user-select:none;transition:transform .25s ease}
.swipecard.drag{transition:none}
.cooktext{font-weight:700;font-size:clamp(24px,7.4vw,31px);line-height:1.2;letter-spacing:-.02em;margin:0}

    }
  } catch (e) {}
  try {
    const q = encodeURIComponent(r.imageQuery + ' dish');
    const res = await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=' + q + '%20filetype%3Abitmap&prop=imageinfo&iiprop=url%7Cextmetadata%7Csize&iiurlwidth=900');

}

function pickFile(camera, cb) {
  let inp = document.getElementById('junoPicker');
  if (!inp) {
    inp = document.createElement('input'); inp.type = 'file'; inp.id = 'junoPicker'; inp.accept = 'image/*';
    inp.setAttribute('aria-hidden', 'true'); inp.tabIndex = -1;
    inp.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(inp);
  }
  if (camera) inp.setAttribute('capture', 'environment'); else inp.removeAttribute('capture');
  inp.value = '';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) cb(f); inp.value = ''; };
  inp.click();
}

  listCheck(el) { const x = S.list.find(i => i.id === el.dataset.arg); if (x) { x.checked = el.checked; persist('list'); render(); } },
  moveFolder(el) { const r = S.saved.recipes.find(x => x.id === el.dataset.arg); if (r) { r.folder = el.value; persist('saved'); render(); } },
  note(el) { const r = S.saved.recipes.find(x => x.id === el.dataset.arg); if (r) { r.note = el.value.slice(0, 500); persist('saved'); } }
};
const onInput = { avoid(el) { S.prefs.avoid = el.value.slice(0, 120); ls.set('prefs', S.prefs); }, reviewNote(el) { S.reviewDraft = el.value; }, scanText(el) { S.scan.text = el.value; }, chatDraft(el) { S.chat.draft = el.value; } };
const onSubmit = {
  addList(form) { const i = form.querySelector('input'); const v = i.value.trim(); if (!v) return; v.split(/[,\n]+/).forEach(n => addToList(n.trim())); i.value = ''; render(); setTimeout(() => $('#listInput')?.focus(), 30); },
  newFolder(form) { const i = form.querySelector('input'); const v = i.value.trim().slice(0, 30); if (!v || S.saved.folders.includes(v)) return; S.saved.folders.push(v); persist('saved'); S.folder = v; render(); },
  chat(form) { sendChat(S.chat.draft || form.querySelector('input').value); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = act[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset.arg, el); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && onChange[el.dataset.change]) onChange[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && onInput[el.dataset.input]) onInput[el.dataset.input](el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); onSubmit[f.dataset.submit] && onSubmit[f.dataset.submit](f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ov) { S.ov === 'cook' ? act.closeCook() : act.close(); } });

render();
initCaps();
})();
</script>
